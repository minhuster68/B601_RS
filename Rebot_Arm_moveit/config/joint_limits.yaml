# Simulation planning limits, deliberately below the CAD-exported velocities.
# Revolute: rad/s and rad/s^2; prismatic: m/s and m/s^2.
default_velocity_scaling_factor: 0.2
default_acceleration_scaling_factor: 0.2
joint_limits:
  joint1: {has_velocity_limits: true, max_velocity: 0.5, has_acceleration_limits: true, max_acceleration: 1.0}
  joint2: {has_velocity_limits: true, max_velocity: 0.5, has_acceleration_limits: true, max_acceleration: 1.0}
  joint3: {has_velocity_limits: true, max_velocity: 0.5, has_acceleration_limits: true, max_acceleration: 1.0}
  joint4: {has_velocity_limits: true, max_velocity: 0.5, has_acceleration_limits: true, max_acceleration: 1.0}
  joint5: {has_velocity_limits: true, max_velocity: 0.5, has_acceleration_limits: true, max_acceleration: 1.0}
  joint6: {has_velocity_limits: true, max_velocity: 0.5, has_acceleration_limits: true, max_acceleration: 1.0}
  gripper_joint1: {has_velocity_limits: true, max_velocity: 0.03, has_acceleration_limits: true, max_acceleration: 0.1}
  gripper_joint2: {has_velocity_limits: true, max_velocity: 0.03, has_acceleration_limits: true, max_acceleration: 0.1}
